name: "Compilar MSI via Issue"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build-msi-from-issue:
    name: "Compilar FolderWorks MSI"
    if: startsWith(github.event.issue.title, '[BUILD-MSI]')
    runs-on: windows-latest

    steps:
      - name: "Clonar Repositório"
        uses: actions/checkout@v4

      - name: "Comentar Início da Compilação na Issue"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: pwsh
        run: |
          $body = @"
          ### 🤖 Compilação Iniciada!
          Recebi sua solicitação de compilação do instalador **FolderWorks.msi**. As máquinas virtuais em nuvem do GitHub Actions já estão preparando e empacotando sua distribuição corporativa.

          ⏱️ **Tempo estimado:** 2 a 3 minutos.
          Assim que a compilação for concluída, o link direto de download será postado aqui neste comentário!
          "@
          gh issue comment $env:ISSUE_NUMBER --repo $env:GH_REPO --body $body

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Instalar Dependências"
        run: npm install --legacy-peer-deps

      - name: "Extrair Parâmetros da Issue e Injetar Configurações"
        id: parse_issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: pwsh
        run: |
          Write-Host "Analisando corpo da issue..."
          $body = $env:ISSUE_BODY

          $compName = "MINHA EMPRESA"
          $srcPath = "\\servidor\gpo\criarpastas\MODELO"
          $destPath = "\\servidor\arquivos\CLIENTES\EMPRESAS"
          $adIp = "10.0.0.10"
          $domUser = "EMPRESA\pasta.servico"
          $domPass = ""
          $tiPass = "admin@123"
          $logoUrl = ""

          # Extrair bloco JSON se existir
          if ($body -match '```json\s*([\s\S]*?)\s*```') {
            try {
              $json = $matches[1] | ConvertFrom-Json
              if ($json.company_name) { $compName = $json.company_name }
              if ($json.source_path) { $srcPath = $json.source_path }
              if ($json.destination_path) { $destPath = $json.destination_path }
              if ($json.ad_server_ip) { $adIp = $json.ad_server_ip }
              if ($json.domain_user) { $domUser = $json.domain_user }
              if ($json.domain_pass) { $domPass = $json.domain_pass }
              if ($json.ti_password) { $tiPass = $json.ti_password }
              if ($json.custom_logo_url) { $logoUrl = $json.custom_logo_url }
              Write-Host "✓ Parâmetros extraídos do bloco JSON com sucesso!"
            } catch {
              Write-Warning "Falha ao analisar JSON da issue: $_"
            }
          }

          $cleanSafeName = ($compName -replace '[^a-zA-Z0-9_-]', '_')

          # Processar Logotipo Customizado se informado
          if ($logoUrl -and $logoUrl.Trim() -ne "") {
            Write-Host "Baixando logotipo de: $logoUrl"
            try {
              Invoke-WebRequest -Uri $logoUrl -OutFile "src/assets/logo.png"
              Write-Host "Logotipo customizado aplicado com sucesso"
            } catch {
              Write-Warning "Falha ao baixar logotipo da URL informada: $_"
            }
          }

          # Gerar custom_config.json
          $cfg = @{
            isLockedByMSI = $true
            tiLogsPassword = $tiPass
            $cleanSafeName = @{
              name = $compName
              companyName = $compName
              sourcePath = $srcPath
              destinationParentPath = $destPath
              destSharePath = $destPath
              allowedBasePath = $destPath
              defaultSourceFolder = $destPath
              logDirectory = ""
              selectedLogFile = ""
              presetDestinations = @()
              adServerIp = $adIp
              domainUser = $domUser
              adPass = $domPass
            }
          }

          $cfgJson = $cfg | ConvertTo-Json -Depth 5
          Set-Content -Path "custom_config.json" -Value $cfgJson -Encoding UTF8
          Write-Host "custom_config.json gerado para: $compName"

          # Salvar saídas para os próximos passos
          Add-Content -Path $env:GITHUB_OUTPUT -Value "company_name=$compName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "clean_name=$cleanSafeName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dest_path=$destPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "source_path=$srcPath"

      - name: "Compilar Pacote MSI Oficial"
        shell: pwsh
        run: |
          $cleanSafeName = "${{ steps.parse_issue.outputs.clean_name }}"
          $targetMsi = "FolderWorks-$cleanSafeName-v3.0.0.msi"
          node build/build_ci_msi.js custom_config.json $targetMsi

      - name: "Criar Release Pública e Anexar MSI"
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: pwsh
        run: |
          $cleanSafeName = "${{ steps.parse_issue.outputs.clean_name }}"
          $compName = "${{ steps.parse_issue.outputs.company_name }}"
          $tag = "v3.0.0-build-$env:ISSUE_NUMBER"
          $msiFile = Get-ChildItem -Path "dist/output/*.msi" | Select-Object -First 1

          if (-not $msiFile) {
            Write-Error "Arquivo MSI não encontrado em dist/output/"
            exit 1
          }

          Write-Host "Criando release $tag com o arquivo $($msiFile.FullName)..."
          gh release create $tag $msiFile.FullName --repo $env:GH_REPO --title "FolderWorks Build #$env:ISSUE_NUMBER ($compName)" --notes "Instalador corporativo compilado automaticamente sob demanda para $compName."

          $repo = $env:GITHUB_REPOSITORY
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$($msiFile.Name)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "download_url=$downloadUrl"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "msi_name=$($msiFile.Name)"

      - name: "Comentar na Issue com Link de Download e Encerrar"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: pwsh
        run: |
          $compName = "${{ steps.parse_issue.outputs.company_name }}"
          $destPath = "${{ steps.parse_issue.outputs.dest_path }}"
          $srcPath = "${{ steps.parse_issue.outputs.source_path }}"
          $downloadUrl = "${{ steps.create_release.outputs.download_url }}"
          $msiName = "${{ steps.create_release.outputs.msi_name }}"

          $reply = @"
          ### ✅ Compilação Concluída com Sucesso!

          O instalador corporativo personalizado para **$compName** foi gerado e está pronto para download.

          ---

          ### 📥 Download Direto do Instalador
          👉 **[$msiName]($downloadUrl)**

          * 📁 **Nome do Arquivo:** `$msiName`
          * 🏢 **Empresa:** `$compName`
          * 📂 **Pasta Modelo:** `$srcPath`
          * 🎯 **Destino dos Clientes:** `$destPath`
          * 💻 **Compatibilidade:** Windows 10 e Windows 11 (x64)
          * 🔒 **Segurança:** 100% Autocontido, com caminhos e permissões embutidos

          ---
          *Esta solicitação foi atendida e concluída automaticamente pelo robô do FolderWorks.*
          "@

          gh issue comment $env:ISSUE_NUMBER --repo $env:GH_REPO --body $reply
          gh issue close $env:ISSUE_NUMBER --repo $env:GH_REPO --reason "completed"
          Write-Host "✓ Issue #$env:ISSUE_NUMBER finalizada com sucesso!"
